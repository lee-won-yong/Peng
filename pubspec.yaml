name: peng
description: Private Flutter vocabulary trainer for a child's English books.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  http: ^1.2.2
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/data/il_seong_interview.json
    - assets/characters/
